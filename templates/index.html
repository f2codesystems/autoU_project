<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AutoU – Classificação de E-mails</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --autou-orange: #FF874D;            /* Laranja suave */
            --autou-orange-dark: #E96D2E;       /* Laranja escuro suave */
            --autou-orange-light: #FF9D6F;      /* Laranja clarinho */
            --autou-white: #FFFFFF;
            --autou-soft-gray: #F9F9F9;
            --autou-text-dark: #2A2A2A;
        }

        body {
            background: linear-gradient(135deg, var(--autou-orange-light), var(--autou-orange));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: var(--autou-text-dark);
            font-family: "Segoe UI", sans-serif;
        }

        .logo {
            display: block;
            margin: 0 auto 20px;
            width: 110px; /* um pouco menor */
            filter: drop-shadow(1px 1px 3px rgba(0,0,0,0.15));
        }

        h1.title {
            font-weight: 700;
            color: var(--autou-white);
            text-shadow: 0 1px 6px rgba(0,0,0,0.25);
            margin-bottom: 20px;
        }

        .card-custom {
            background: var(--autou-white);
            border-radius: 18px;
            padding: 32px;
            border: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
            transition: all 0.25s ease;
        }

        .card-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.18);
        }

        textarea {
            resize: none;
            border-radius: 10px;
        }

        .divider {
            height: 1px;
            background: #e8e8e8;
            margin: 20px 0;
        }

        .btn-custom {
            background: var(--autou-orange);
            border: none;
            padding: 14px;
            color: var(--autou-white);
            font-size: 17px;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.25s ease;
        }

        .btn-custom:hover {
            background: var(--autou-orange-dark);
            transform: translateY(-2px);
        }

        .result-box {
            background: var(--autou-soft-gray);
            padding: 16px;
            border-left: 5px solid #28a745;
            border-radius: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
<div class="container" style="max-width: 750px;">

    <!-- Coloque sua logo aqui -->
    <img src="/static/autou_logo.png" alt="Logo AutoU" class="logo">

    <h1 class="text-center title">
        <i class="bi bi-envelope-open"></i> AutoU – Classificação de E-mails
    </h1>

    <div class="card card-custom">

        <form method="POST" enctype="multipart/form-data">

            <label for="email_text" class="form-label fw-semibold">
                <i class="bi bi-envelope-paper"></i> Cole o conteúdo do e-mail:
            </label>

            <textarea name="email_text" id="email_text" class="form-control mb-3"
                      rows="6" placeholder="Digite ou cole o texto aqui..."></textarea>

            <div class="divider"></div>

            <p class="text-center fw-semibold">Ou envie um arquivo (.txt ou .pdf)</p>

            <div class="mb-4">
                <input type="file" name="file" class="form-control">
            </div>

            <button type="submit" class="btn btn-custom w-100">
                <i class="bi bi-search"></i> Analisar E-mail
            </button>
        </form>

        {% if result %}
        <div class="mt-4">
            <h5 class="text-success fw-bold">
                <i class="bi bi-check-circle-fill"></i> Resultado
            </h5>
            <div class="result-box">
                <pre>{{ result }}</pre>
            </div>
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
